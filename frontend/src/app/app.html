<header class="app-nav">
  <strong>TaskFlow</strong>
  <nav>
    @if (auth.currentUser(); as user) {
      <span class="who">Hi, {{ user.full_name || user.email }}</span>
      <button (click)="onLogout()">Logout</button>
    } @else {
      <a routerLink="/login">Log In</a>
    }
  </nav>
</header>

<main class="app-content">
  <router-outlet></router-outlet>

  <app-greeting></app-greeting>

  <hr />

  <h2>API Health</h2>
  @if (health(); as h) {
    <p>
      Status:
      <strong [style.color]="h.success ? 'green' : 'red'">
        {{ h.success ? 'OK' : 'DOWN' }}
      </strong>
    </p>
    <pre>{{ h.data | json }}</pre>
    <p>{{ h.message }}</p>
  } @else {
    <p>Loading...</p>
  }
</main>
