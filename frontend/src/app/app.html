<h1>TaskFlow</h1>

<app-greeting></app-greeting>

<hr />

<h2>API Health</h2>

@if (health(); as h) {
  <p>
    Status:
    <strong [style.color]="h.success ? 'blue' : 'red'">
      {{ h.success ? 'OK' : 'DOWN' }}
    </strong>
  </p>
  <pre>{{ h.data | json }}</pre>
  <p>{{ h.message }}</p>
} @else {
  <p>Loading...</p>
}
